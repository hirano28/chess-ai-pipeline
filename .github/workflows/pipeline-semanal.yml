name: Pipeline semanal

on:
  schedule:
    # 07:00 em Brasilia (10:00 UTC).
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  pipeline-semanal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # o passo "Abrir issue de falha" no fim do job
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias Python
        run: python -m pip install -r backend/requirements.txt

      - name: Medir eficacia de treinos
        id: medir_eficacia
        continue-on-error: true
        run: python backend/agentes/medir_eficacia.py

      - name: Executar Agente 2 - Analista
        id: agente2_analista
        run: python backend/agentes/agente2_analista.py

      - name: Executar Agente 3 - Prescritor
        id: agente3_prescritor
        run: python backend/agentes/agente3_prescritor.py

      - name: Registrar falhas no summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Falhas do pipeline semanal"
            echo
            echo "O workflow falhou em pelo menos uma etapa."
            echo
            echo "| Etapa | Resultado |"
            echo "| --- | --- |"
            echo "| Medir eficacia | ${{ steps.medir_eficacia.outcome || 'nao executada' }} |"
            echo "| Agente 2 | ${{ steps.agente2_analista.outcome || 'nao executada' }} |"
            echo "| Agente 3 | ${{ steps.agente3_prescritor.outcome || 'nao executada' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-pipeline-semanal
          path: backend/logs/*.log
          if-no-files-found: warn

      # Alerta de falha (D-61) — mesma justificativa do pipeline diario, com um
      # agravante: este roda 1x por semana. Uma falha silenciosa aqui significa
      # SETE dias sem hexagono novo nem medicao de eficacia, e a proxima chance
      # de perceber so viria na segunda seguinte.
      - name: Abrir issue de falha
        if: >-
          failure()
          || steps.medir_eficacia.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITULO: "Falha automatica: Pipeline semanal"
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          corpo=$(printf '%s\n' \
            "O workflow **Pipeline semanal** falhou (no todo ou em alguma etapa)." \
            "" \
            "- Run: $URL_RUN" \
            "- Commit: \`${{ github.sha }}\`" \
            "- Status do job: ${{ job.status }}" \
            "" \
            "| Etapa | Resultado |" \
            "| --- | --- |" \
            "| Medir eficacia | ${{ steps.medir_eficacia.outcome || 'nao executada' }} |" \
            "| Agente 2 (hexagono) | ${{ steps.agente2_analista.outcome || 'nao executada' }} |" \
            "| Agente 3 (sprint) | ${{ steps.agente3_prescritor.outcome || 'nao executada' }} |" \
            "" \
            "Sem isto nao ha hexagono novo, sprint prescrita nem medicao de eficacia por mais uma semana.")
          existente=$(gh issue list --state open --label falha-automacao \
            --search "$TITULO in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --body "$corpo"
          else
            gh issue create --title "$TITULO" --label falha-automacao --body "$corpo"
          fi
