name: Deploy Backend Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docs/GUIA_GUESS_THE_MOVE.md"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: "gen-lang-client-0828609060"
  GCP_REGION: "us-east1"
  SERVICE_NAME: "laboratorio-xadrez"
  IMAGE_NAME: "us-east1-docker.pkg.dev/gen-lang-client-0828609060/cloud-run-source-deploy/laboratorio-xadrez"

jobs:
  test-and-deploy:
    name: Testar e Deployar no Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write   # o passo "Abrir issue de falha" no fim do job

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias Python
        run: python -m pip install -r backend/requirements.txt

      - name: Instalar Stockfish para testes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends stockfish

      - name: Executar testes unitarios do backend
        run: |
          python -m unittest \
            backend.agentes.test_agente1_linter \
            backend.agentes.test_agente2_analista \
            backend.agentes.test_agente3_prescritor \
            backend.agentes.test_analisar_pgn_avulso \
            backend.agentes.test_explicador_posicao \
            backend.agentes.test_gerar_perguntas_pendentes \
            backend.agentes.test_gerar_resumo_partida \
            backend.agentes.test_insights_repertorio \
            backend.agentes.test_insights_puzzles \
            backend.agentes.test_medir_eficacia \
            backend.agentes.test_normalizar_aberturas \
            backend.agentes.test_popular_fila_treino_espacado \
            backend.agentes.test_revisar_exercicio_avulso \
            backend.agentes.test_revisar_pensamento \
            backend.analise_engine.test_analisar_partidas \
            backend.analise_engine.test_backfill_fen_lances_criticos \
            backend.api.test_api_server \
            backend.common.test_chess_math \
            backend.common.test_cadencia \
            backend.common.test_lichess_explorer \
            backend.common.test_lichess_oauth \
            backend.common.test_notacao_pt \
            backend.common.test_progress \
            backend.common.test_settings \
            backend.common.test_spaced_repetition \
            backend.common.test_syzygy_tablebase \
            backend.common.test_tenant \
            backend.ingestao.test_backfill_pgn_lichess \
            backend.ingestao.test_backfill_tempos_chesscom \
            backend.ingestao.test_coletar_partidas \
            backend.ingestao.test_coletar_partidas_chesscom \
            backend.ingestao.test_common_ingestao \
            backend.ingestao.test_enriquecer_partidas_lichess \
            backend.ingestao.test_importar_puzzle_activity \
            backend.rag.test_importar_exercicios_taticos \
            backend.rag.test_importar_exercicios_posicionais \
            backend.rag.test_importar_indice_conceitual \
            backend.rag.test_processar_livro

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker no Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gerar arquivo de env vars para o Cloud Run a partir dos GitHub Secrets
        # Fonte de verdade passa a ser os Secrets do repositorio, não mais o
        # env.yaml local que só o comando manual lia (ver D-20 em DECISOES.md).
        # Esta lista tem que continuar batendo com o que o servidor realmente
        # exige em runtime: SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY/GEMINI_API_KEY
        # (load_settings() em revisar_pensamento.py) e DEFAULT_USER_ID
        # (obter_default_user_id() em backend/common/tenant.py). STOCKFISH_PATH
        # não entra aqui: vem gravado na imagem via ENV no Dockerfile.
        # API_SECRET_KEYS removida numa auditoria pós-D-49: gate de acesso
        # aposentado desde o D-25 (verificar_sessao/JWT do Supabase Auth), o
        # servidor não lê mais essa variável.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEFAULT_USER_ID: ${{ secrets.DEFAULT_USER_ID }}
        run: |
          ARQUIVO_ENV="$RUNNER_TEMP/cloud-run-env.yaml"
          FALTANTES=""
          for NOME in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY GEMINI_API_KEY DEFAULT_USER_ID; do
            if [ -z "${!NOME}" ]; then
              FALTANTES="$FALTANTES $NOME"
            fi
          done
          if [ -n "$FALTANTES" ]; then
            echo "Secret(s) ausente(s) no repositorio:$FALTANTES. Cadastre em Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          {
            echo "SUPABASE_URL: \"${SUPABASE_URL}\""
            echo "SUPABASE_SERVICE_ROLE_KEY: \"${SUPABASE_SERVICE_ROLE_KEY}\""
            echo "GEMINI_API_KEY: \"${GEMINI_API_KEY}\""
            echo "DEFAULT_USER_ID: \"${DEFAULT_USER_ID}\""
          } > "$ARQUIVO_ENV"
          echo "CLOUD_RUN_ENV_FILE=$ARQUIVO_ENV" >> "$GITHUB_ENV"

      - name: Deploy da nova revisao no Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --region "${{ env.GCP_REGION }}" \
            --memory 2Gi \
            --cpu 2 \
            --no-cpu-throttling \
            --env-vars-file="${{ env.CLOUD_RUN_ENV_FILE }}" \
            --quiet


      - name: Validar saude da aplicacao (Health Check)
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region "${{ env.GCP_REGION }}" --format="value(status.url)")
          echo "Testando endpoint de saude: $SERVICE_URL/health"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Health check falhou com status code: $STATUS_CODE" >&2
            exit 1
          fi

          # /health responder 200 NAO prova que este commit subiu: ele responde
          # 200 igual numa revisao antiga. Foi assim que o backend ficou parado
          # no D-49 por dois dias com o health check verde, enquanto a Vercel
          # publicava um frontend que chamava endpoints inexistentes.
          # Confirmar qual imagem esta de fato servindo trafego fecha esse furo.
          IMAGEM_ESPERADA="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGEM_SERVIDA=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region "${{ env.GCP_REGION }}" \
            --format="value(spec.template.spec.containers[0].image)")
          if [ "$IMAGEM_SERVIDA" != "$IMAGEM_ESPERADA" ]; then
            echo "A revisao ativa nao e a deste commit." >&2
            echo "  esperada: $IMAGEM_ESPERADA" >&2
            echo "  servindo: $IMAGEM_SERVIDA" >&2
            exit 1
          fi
          echo "Revisao ativa confere com o commit: $IMAGEM_SERVIDA"

          echo "Deploy realizado com sucesso! Servico ativo em: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - name: Registrar resultado no resumo do job
        if: always()
        run: |
          {
            echo "## Resultado do Deploy do Backend"
            echo
            echo "- **Status:** ${{ job.status }}"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Imagem:** \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            if [ -n "$SERVICE_URL" ]; then
              echo "- **URL do Servico:** $SERVICE_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Alerta de falha (D-61). Este e o alerta mais importante dos tres: uma
      # falha aqui nao derruba a aplicacao -- ela congela o backend numa versao
      # antiga enquanto a Vercel segue publicando o frontend a cada push. O
      # resultado e o pior tipo de defeito: telas novas chamando endpoints que
      # ainda nao existem em producao, com /health respondendo 200 o tempo todo.
      - name: Abrir issue de falha
        # `cancelled()` junto com `failure()`: um estouro de `timeout-minutes`
        # aparece como cancelamento, e deploy interrompido no meio deixa
        # exatamente a divergencia frontend/backend que este alerta existe
        # para denunciar.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITULO: "Falha automatica: Deploy do backend"
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          corpo=$(printf '%s\n' \
            "O deploy do backend no Cloud Run **falhou**." \
            "" \
            "- Run: $URL_RUN" \
            "- Commit: \`${{ github.sha }}\`" \
            "" \
            "**O backend em producao continua na versao anterior.** A Vercel publica o frontend a cada push de forma independente, entao ate isto ser corrigido producao fica com frontend novo e backend velho -- telas chamando endpoints inexistentes. O \`/health\` responde 200 mesmo assim; para conferir de verdade, chame um endpoint introduzido no commit acima.")
          existente=$(gh issue list --state open --label falha-automacao \
            --search "$TITULO in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --body "$corpo"
          else
            gh issue create --title "$TITULO" --label falha-automacao --body "$corpo"
          fi
