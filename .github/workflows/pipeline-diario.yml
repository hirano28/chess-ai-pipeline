name: Pipeline diario

on:
  schedule:
    # 06:00 aproximado em Brasilia (09:00 UTC).
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  pipeline-diario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write   # o passo "Abrir issue de falha" no fim do job
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LICHESS_GAMES_LIMIT: ${{ secrets.LICHESS_GAMES_LIMIT }}
      LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
      CHESSCOM_MONTHS_LIMIT: ${{ secrets.CHESSCOM_MONTHS_LIMIT }}
      STOCKFISH_DEPTH: 16
      GEMINI_RATE_LIMIT_SLEEP_SEC: 2

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias Python
        run: python -m pip install -r backend/requirements.txt

      - name: Instalar Stockfish
        id: instalar_stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          STOCKFISH_PATH="$(command -v stockfish || true)"
          if [ -z "$STOCKFISH_PATH" ]; then
            for candidate in /usr/games/stockfish /usr/bin/stockfish; do
              if [ -x "$candidate" ]; then
                STOCKFISH_PATH="$candidate"
                break
              fi
            done
          fi
          if [ -z "$STOCKFISH_PATH" ]; then
            echo "Stockfish nao foi encontrado apos a instalacao." >&2
            exit 1
          fi
          echo "STOCKFISH_PATH=$STOCKFISH_PATH" >> "$GITHUB_ENV"
          echo "Stockfish encontrado em: $STOCKFISH_PATH"

      - name: Coletar partidas do Lichess
        id: coletar_lichess
        continue-on-error: true
        run: python backend/ingestao/coletar_partidas.py

      - name: Coletar partidas do Chess.com
        id: coletar_chesscom
        continue-on-error: true
        run: python backend/ingestao/coletar_partidas_chesscom.py

      - name: Importar puzzles do Lichess
        id: importar_puzzles
        continue-on-error: true
        run: python backend/ingestao/importar_puzzle_activity.py

      - name: Enriquecer partidas do Lichess
        id: enriquecer_lichess
        continue-on-error: true
        run: python backend/ingestao/enriquecer_partidas_lichess.py

      - name: Analisar partidas com Stockfish
        id: analisar_engine
        run: python backend/analise_engine/analisar_partidas.py

      - name: Gerar diagnosticos com Agente 1
        id: agente1_linter
        run: python backend/agentes/agente1_linter.py

      - name: Popular fila de treino espacado
        id: popular_fila_treino
        continue-on-error: true
        run: python backend/agentes/popular_fila_treino_espacado.py

      - name: Gerar perguntas pendentes
        id: gerar_perguntas
        continue-on-error: true
        run: python backend/agentes/gerar_perguntas_pendentes.py

      - name: Gerar resumos das partidas
        id: gerar_resumos
        continue-on-error: true
        run: python backend/agentes/gerar_resumo_partida.py

      - name: Registrar falhas no summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Falhas do pipeline diario"
            echo
            echo "O workflow falhou em pelo menos uma etapa."
            echo
            echo "| Etapa | Resultado |"
            echo "| --- | --- |"
            echo "| Instalar Stockfish | ${{ steps.instalar_stockfish.outcome || 'nao executada' }} |"
            echo "| Coleta Lichess | ${{ steps.coletar_lichess.outcome || 'nao executada' }} |"
            echo "| Coleta Chess.com | ${{ steps.coletar_chesscom.outcome || 'nao executada' }} |"
            echo "| Puzzles Lichess | ${{ steps.importar_puzzles.outcome || 'nao executada' }} |"
            echo "| Enriquecer Lichess | ${{ steps.enriquecer_lichess.outcome || 'nao executada' }} |"
            echo "| Analise Stockfish | ${{ steps.analisar_engine.outcome || 'nao executada' }} |"
            echo "| Agente 1 | ${{ steps.agente1_linter.outcome || 'nao executada' }} |"
            echo "| Fila de treino espacado | ${{ steps.popular_fila_treino.outcome || 'nao executada' }} |"
            echo "| Perguntas pendentes | ${{ steps.gerar_perguntas.outcome || 'nao executada' }} |"
            echo "| Resumos de partidas | ${{ steps.gerar_resumos.outcome || 'nao executada' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-pipeline-diario
          path: backend/logs/*.log
          if-no-files-found: warn

      # Alerta de falha (D-61). O resumo do job acima so aparece pra quem abre
      # a pagina do run -- e foi exatamente por isso que uma quebra de CI
      # passou dois dias sem ninguem notar, enquanto a coleta de partidas
      # parava. Uma issue chega por notificacao e fica aberta ate alguem
      # fechar, entao o alerta sobrevive a nao ser lido na hora.
      # A condicao cobre DOIS casos. O obvio e o job falhar. O silencioso e a
      # maioria das etapas de coleta ter `continue-on-error: true` -- decisao
      # correta (a queda do Chess.com nao pode matar a coleta do Lichess), mas
      # com um efeito colateral ruim: o job fica verde tendo coletado zero
      # partida. Sem a segunda metade da condicao, o alerta perderia justo o
      # modo de falha mais dificil de perceber.
      - name: Abrir issue de falha
        if: >-
          failure()
          || steps.coletar_lichess.outcome == 'failure'
          || steps.coletar_chesscom.outcome == 'failure'
          || steps.importar_puzzles.outcome == 'failure'
          || steps.enriquecer_lichess.outcome == 'failure'
          || steps.popular_fila_treino.outcome == 'failure'
          || steps.gerar_perguntas.outcome == 'failure'
          || steps.gerar_resumos.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITULO: "Falha automatica: Pipeline diario"
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          corpo=$(printf '%s\n' \
            "O workflow **Pipeline diario** falhou (no todo ou em alguma etapa)." \
            "" \
            "- Run: $URL_RUN" \
            "- Commit: \`${{ github.sha }}\`" \
            "- Status do job: ${{ job.status }}" \
            "" \
            "| Etapa | Resultado |" \
            "| --- | --- |" \
            "| Coleta Lichess | ${{ steps.coletar_lichess.outcome || 'nao executada' }} |" \
            "| Coleta Chess.com | ${{ steps.coletar_chesscom.outcome || 'nao executada' }} |" \
            "| Puzzles Lichess | ${{ steps.importar_puzzles.outcome || 'nao executada' }} |" \
            "| Enriquecer Lichess | ${{ steps.enriquecer_lichess.outcome || 'nao executada' }} |" \
            "| Analise Stockfish | ${{ steps.analisar_engine.outcome || 'nao executada' }} |" \
            "| Agente 1 | ${{ steps.agente1_linter.outcome || 'nao executada' }} |" \
            "| Fila de treino espacado | ${{ steps.popular_fila_treino.outcome || 'nao executada' }} |" \
            "| Perguntas pendentes | ${{ steps.gerar_perguntas.outcome || 'nao executada' }} |" \
            "| Resumos de partidas | ${{ steps.gerar_resumos.outcome || 'nao executada' }} |" \
            "" \
            "Com a coleta parada nao entram partidas novas, e sem elas nao ha diagnostico nem fila de treino.")
          # Uma issue por falha recorrente, nao uma por dia: se ja existe uma
          # aberta, comenta nela.
          existente=$(gh issue list --state open --label falha-automacao \
            --search "$TITULO in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --body "$corpo"
          else
            gh issue create --title "$TITULO" --label falha-automacao --body "$corpo"
          fi
