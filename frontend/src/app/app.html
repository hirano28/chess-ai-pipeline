<!--
  Casca da aplicação. O cabeçalho só existe para quem está logado: sem sessão a
  única rota alcançável é /login (authGuard, D-23), então mostrar a navegação ali
  seria oferecer 5 links que voltam todos para a mesma tela.
-->
@if (authService.autenticado()) {
  <!--
    Primeiro ponto de tabulação da página: sem ele, quem navega por teclado
    atravessa os 6 links da navegação, o e-mail e o "Sair" a cada troca de tela
    antes de chegar no conteúdo.
  -->
  <a href="#conteudo" class="link-pular">Pular para o conteúdo</a>

  <header class="sticky top-0 z-40 border-b border-linha bg-ardosia-900/80 backdrop-blur-xl">
    <div
      class="mx-auto flex w-full max-w-6xl flex-wrap items-center gap-x-6 gap-y-1 px-5 py-3 sm:px-8 lg:px-12"
    >
      <a
        routerLink="/"
        class="group flex shrink-0 items-center gap-2.5 text-marfim"
        aria-label="Hexágono — início"
      >
        <span
          class="text-latao-500 transition-transform duration-300 group-hover:rotate-[30deg]"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none">
            <path
              d="M12 2 20.66 7v10L12 22 3.34 17V7z"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linejoin="round"
              opacity="0.5"
            />
            <path
              d="M12 5 15.9 9.75 17.2 15 12 15.5 6.37 15.25 7.67 9.5z"
              fill="currentColor"
              opacity="0.9"
            />
          </svg>
        </span>
        <span class="font-display text-lg font-semibold tracking-tight">Hexágono</span>
      </a>

      <!--
        No celular a navegação rola na horizontal com a barra escondida, então
        "Analisador" e "Perfil" ficavam fora da tela sem nenhuma pista de que
        havia mais. `.nav-rolavel` desvanece a borda direita para sinalizar isso.
      -->
      <nav
        class="nav-rolavel order-3 -mx-1 flex w-full items-center gap-1 overflow-x-auto sem-barra pb-1 sm:order-none sm:mx-0 sm:w-auto sm:pb-0"
        aria-label="Navegação principal"
      >
        <a
          routerLink="/"
          routerLinkActive="nav-link-ativo"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
          title="Meu Hexágono de Xadrez"
        >
          Hexágono
        </a>
        <a
          routerLink="/treino"
          routerLinkActive="nav-link-ativo"
          class="nav-link"
          title="Treino Diário"
        >
          Treino
        </a>
        <a
          routerLink="/laboratorio"
          routerLinkActive="nav-link-ativo"
          class="nav-link"
          title="Laboratório de Raciocínio"
        >
          Laboratório
        </a>
        <a
          routerLink="/explicador"
          routerLinkActive="nav-link-ativo"
          class="nav-link"
          title="Explicador de Posição"
        >
          Explicador
        </a>
        <a
          routerLink="/analisador"
          routerLinkActive="nav-link-ativo"
          class="nav-link"
          title="Analisador de Partida"
        >
          Analisador
        </a>
        @if (consultaAoVivoHabilitada()) {
          <a
            routerLink="/consulta-ao-vivo"
            routerLinkActive="nav-link-ativo"
            class="nav-link"
            title="Consulta ao vivo (partida em andamento)"
          >
            Ao vivo
          </a>
        }
        <a routerLink="/perfil" routerLinkActive="nav-link-ativo" class="nav-link" title="Meu Perfil">
          Perfil
        </a>
      </nav>

      <div class="ml-auto flex min-w-0 shrink items-center gap-2.5">
        <span
          class="hidden max-w-[18ch] truncate text-xs text-bruma-500 md:inline"
          [title]="authService.usuario()?.email"
        >
          {{ authService.usuario()?.email }}
        </span>
        <button type="button" class="btn btn-secundario btn-pequeno" (click)="sair()" title="Encerrar sessão">
          Sair
        </button>
      </div>
    </div>
  </header>
}

<div id="conteudo" tabindex="-1">
  <router-outlet />
</div>
<app-modal-onboarding-contas />
